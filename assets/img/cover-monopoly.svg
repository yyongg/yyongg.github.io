<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Abstract board-game perimeter with coloured property groups and a reward curve">
  <defs>
    <linearGradient id="bgM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1c2b"/>
      <stop offset="1" stop-color="#0d0f16"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgM)"/>

  <!-- board perimeter -->
  <rect x="118" y="38" width="404" height="284" rx="10" fill="none" stroke="#333a52" stroke-width="2"/>
  <rect x="160" y="80" width="320" height="200" rx="6" fill="none" stroke="#242a3d" stroke-width="1.5"/>

  <!-- property colour bands, top edge -->
  <g>
    <rect x="130" y="46" width="44" height="9" rx="3" fill="#8b5a2b"/>
    <rect x="182" y="46" width="44" height="9" rx="3" fill="#7dd3fc"/>
    <rect x="234" y="46" width="44" height="9" rx="3" fill="#f472b6"/>
    <rect x="286" y="46" width="44" height="9" rx="3" fill="#f0913f"/>
    <rect x="338" y="46" width="44" height="9" rx="3" fill="#f87171"/>
    <rect x="390" y="46" width="44" height="9" rx="3" fill="#fde047"/>
    <rect x="442" y="46" width="44" height="9" rx="3" fill="#4ade80"/>
  </g>
  <!-- bottom edge, dimmed -->
  <g opacity=".4">
    <rect x="130" y="305" width="44" height="9" rx="3" fill="#f0913f"/>
    <rect x="182" y="305" width="44" height="9" rx="3" fill="#4ade80"/>
    <rect x="234" y="305" width="44" height="9" rx="3" fill="#7dd3fc"/>
    <rect x="286" y="305" width="44" height="9" rx="3" fill="#f87171"/>
    <rect x="338" y="305" width="44" height="9" rx="3" fill="#fde047"/>
    <rect x="390" y="305" width="44" height="9" rx="3" fill="#f472b6"/>
    <rect x="442" y="305" width="44" height="9" rx="3" fill="#818cf8"/>
  </g>

  <!-- houses on the orange set -->
  <g fill="#f0913f">
    <path d="M292 66l7-7 7 7v8h-14z"/>
    <path d="M310 66l7-7 7 7v8h-14z"/>
  </g>

  <!-- learning curve inside the board -->
  <path d="M180 252 C232 250 250 226 282 214 C318 200 336 180 372 160 C408 141 432 132 462 126"
        fill="none" stroke="#f0913f" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M180 252 C232 250 250 226 282 214 C318 200 336 180 372 160 C408 141 432 132 462 126 L462 260 L180 260 Z"
        fill="#f0913f" opacity=".1"/>
  <circle cx="462" cy="126" r="6" fill="#f0913f"/>

  <!-- chance-level reference -->
  <path d="M180 212h282" stroke="#5b6580" stroke-width="1.5" stroke-dasharray="5 5"/>

  <g font-family="ui-monospace, monospace" font-size="12" fill="#8b93ab">
    <text x="180" y="204">chance 25%</text>
    <text x="404" y="112" fill="#f0913f">31.5%</text>
  </g>
</svg>
