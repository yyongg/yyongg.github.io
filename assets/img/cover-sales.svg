<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Many overlapping sales time series with a shaded sixteen-day forecast window">
  <defs>
    <linearGradient id="bgS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131e22"/>
      <stop offset="1" stop-color="#0b1013"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgS)"/>

  <!-- gridlines -->
  <g stroke="#22333a" stroke-width="1">
    <path d="M40 80h570M40 150h570M40 220h570M40 290h570"/>
  </g>

  <!-- background series -->
  <g fill="none" stroke="#3d5a62" stroke-width="1.6" opacity=".7">
    <path d="M40 240 62 226 84 248 106 214 128 238 150 206 172 232 194 200 216 226 238 196 260 220 282 188 304 214 326 182 348 208 370 176 392 202 414 172"/>
    <path d="M40 276 62 268 84 284 106 262 128 278 150 256 172 272 194 250 216 268 238 246 260 262 282 242 304 258 326 238 348 254 370 234 392 250 414 232"/>
    <path d="M40 188 62 202 84 176 106 196 128 168 150 190 172 162 194 184 216 158 238 178 260 152 282 174 304 148 326 170 348 144 370 166 392 140 414 160"/>
    <path d="M40 130 62 118 84 142 106 122 128 146 150 126 172 150 194 128 216 152 238 132 260 156 282 134 304 158 326 138 348 160 370 140 392 162 414 142"/>
  </g>

  <!-- forecast window -->
  <rect x="414" y="60" width="196" height="240" fill="#f0913f" opacity=".07"/>
  <path d="M414 60v240" stroke="#f0913f" stroke-width="1.5" stroke-dasharray="6 5" opacity=".8"/>

  <!-- highlighted series: history solid, forecast dashed -->
  <path d="M40 210 62 194 84 218 106 182 128 206 150 172 172 198 194 164 216 190 238 156 260 182 282 148 304 174 326 140 348 166 370 132 392 158 414 126"
        fill="none" stroke="#f0913f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M414 126 436 150 458 118 480 142 502 110 524 134 546 104 568 128 590 100"
        fill="none" stroke="#f0913f" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
  <circle cx="414" cy="126" r="5.5" fill="#f0913f"/>

  <g font-family="ui-monospace, monospace" font-size="12" fill="#7e9aa3">
    <text x="40" y="330">1,782 series</text>
    <text x="424" y="330" fill="#f0913f">16-day horizon</text>
  </g>
</svg>
