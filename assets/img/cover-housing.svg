<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Scatter plot of predicted versus actual house prices hugging the diagonal">
  <defs>
    <linearGradient id="bgH" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101f1d"/>
      <stop offset="1" stop-color="#0a1211"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgH)"/>

  <!-- axes -->
  <g stroke="#274240" stroke-width="1.5">
    <path d="M72 300h520M72 300V44"/>
  </g>
  <g stroke="#1c302e" stroke-width="1">
    <path d="M72 236h520M72 172h520M72 108h520"/>
  </g>

  <!-- ideal line -->
  <path d="M72 300 560 60" stroke="#f0913f" stroke-width="2.5" stroke-dasharray="8 6" stroke-linecap="round"/>

  <!-- predictions -->
  <g fill="#5eead4" opacity=".85">
    <circle cx="112" cy="278" r="5"/><circle cx="140" cy="268" r="5"/><circle cx="132" cy="284" r="4"/>
    <circle cx="176" cy="252" r="5"/><circle cx="196" cy="248" r="4"/><circle cx="188" cy="264" r="5"/>
    <circle cx="222" cy="232" r="5"/><circle cx="244" cy="228" r="4"/><circle cx="236" cy="244" r="5"/>
    <circle cx="272" cy="212" r="5"/><circle cx="292" cy="206" r="4"/><circle cx="284" cy="222" r="5"/>
    <circle cx="320" cy="188" r="5"/><circle cx="342" cy="184" r="4"/><circle cx="334" cy="200" r="5"/>
    <circle cx="368" cy="168" r="5"/><circle cx="390" cy="160" r="4"/><circle cx="382" cy="178" r="5"/>
    <circle cx="416" cy="146" r="5"/><circle cx="438" cy="140" r="4"/><circle cx="430" cy="156" r="5"/>
    <circle cx="464" cy="124" r="5"/><circle cx="486" cy="116" r="4"/><circle cx="478" cy="134" r="5"/>
    <circle cx="510" cy="100" r="5"/><circle cx="532" cy="92" r="4"/><circle cx="524" cy="110" r="5"/>
  </g>
  <!-- a few honest outliers -->
  <g fill="#5eead4" opacity=".45">
    <circle cx="204" cy="200" r="4"/><circle cx="356" cy="230" r="4"/><circle cx="452" cy="186" r="4"/>
  </g>

  <g font-family="ui-monospace, monospace" font-size="12" fill="#6f9a94">
    <text x="72" y="330">actual sale price</text>
    <text x="452" y="52" fill="#f0913f">top 500 / 950k</text>
  </g>
  <text transform="translate(50 200) rotate(-90)" text-anchor="middle"
        font-family="ui-monospace, monospace" font-size="12" fill="#6f9a94">predicted</text>
</svg>
