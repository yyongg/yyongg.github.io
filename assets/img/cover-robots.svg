<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Abstract street grid with segments coloured green, yellow and red">
  <defs>
    <linearGradient id="bgR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#152030"/>
      <stop offset="1" stop-color="#0c1219"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgR)"/>

  <!-- base street grid -->
  <g stroke="#2b3949" stroke-width="1.5" opacity=".9">
    <path d="M0 70h640M0 140h640M0 218h640M0 292h640"/>
    <path d="M96 0v360M196 0v360M300 0v360M404 0v360M508 0v360"/>
  </g>

  <!-- scored segments -->
  <g stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M96 70h100" stroke="#4ade80"/>
    <path d="M196 70h104" stroke="#4ade80"/>
    <path d="M300 140h104" stroke="#4ade80"/>
    <path d="M404 140h104" stroke="#fbbf24"/>
    <path d="M196 140v78" stroke="#4ade80"/>
    <path d="M300 70v70" stroke="#fbbf24"/>
    <path d="M96 218h100" stroke="#fbbf24"/>
    <path d="M196 218h104" stroke="#f87171"/>
    <path d="M404 218v74" stroke="#f87171"/>
    <path d="M300 292h104" stroke="#4ade80"/>
    <path d="M508 70v70" stroke="#4ade80"/>
    <path d="M508 218h80" stroke="#fbbf24"/>
  </g>

  <!-- robot -->
  <g transform="translate(276 116)">
    <rect x="0" y="0" width="48" height="34" rx="9" fill="#f0913f"/>
    <circle cx="15" cy="14" r="4" fill="#152030"/>
    <circle cx="33" cy="14" r="4" fill="#152030"/>
    <path d="M14 24h20" stroke="#152030" stroke-width="3" stroke-linecap="round"/>
    <circle cx="12" cy="38" r="6" fill="#e0e6ee"/>
    <circle cx="36" cy="38" r="6" fill="#e0e6ee"/>
  </g>

  <!-- tier legend -->
  <g font-family="ui-monospace, monospace" font-size="12" fill="#8b98a8">
    <circle cx="40" cy="326" r="5" fill="#4ade80"/><text x="52" y="330">70+</text>
    <circle cx="108" cy="326" r="5" fill="#fbbf24"/><text x="120" y="330">40-70</text>
    <circle cx="196" cy="326" r="5" fill="#f87171"/><text x="208" y="330">&lt;40</text>
  </g>
</svg>
