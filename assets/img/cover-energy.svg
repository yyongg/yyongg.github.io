<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Hourly electricity load curve with a tight model prediction tracking it">
  <defs>
    <linearGradient id="bgE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121a2a"/>
      <stop offset="1" stop-color="#0b0f18"/>
    </linearGradient>
    <linearGradient id="fillE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0913f" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f0913f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgE)"/>

  <g stroke="#233047" stroke-width="1">
    <path d="M48 76h560M48 146h560M48 216h560M48 286h560"/>
  </g>

  <!-- actual load: two daily cycles -->
  <path id="loadE" d="M48 250 C82 246 96 178 130 168 C158 160 168 214 196 226 C226 238 238 252 268 246
                      C300 240 314 132 348 120 C376 110 388 168 416 182 C446 197 458 214 488 208
                      C520 202 534 140 568 130 C588 124 598 132 608 138"
        fill="none" stroke="#8fb8ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M48 250 C82 246 96 178 130 168 C158 160 168 214 196 226 C226 238 238 252 268 246
           C300 240 314 132 348 120 C376 110 388 168 416 182 C446 197 458 214 488 208
           C520 202 534 140 568 130 C588 124 598 132 608 138 L608 310 L48 310 Z"
        fill="url(#fillE)"/>

  <!-- model prediction, offset slightly -->
  <path d="M48 244 C82 241 96 184 130 174 C158 166 168 208 196 220 C226 232 238 246 268 241
           C300 235 314 139 348 127 C376 118 388 162 416 176 C446 190 458 207 488 202
           C520 196 534 147 568 137 C588 131 598 138 608 144"
        fill="none" stroke="#f0913f" stroke-width="2.6" stroke-dasharray="8 6" stroke-linecap="round"/>

  <!-- baseline error bracket -->
  <g stroke="#5a6a86" stroke-width="1.5">
    <path d="M594 96v48M588 96h12M588 144h12"/>
  </g>

  <g font-family="ui-monospace, monospace" font-size="12">
    <text x="48" y="336" fill="#8fb8ff">actual load</text>
    <text x="152" y="336" fill="#f0913f">forecast</text>
    <text x="452" y="86" fill="#93a2bd">1422 MW &#8594; 449 MW</text>
  </g>
</svg>
