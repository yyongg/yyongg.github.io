<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Two headline cards being sorted into clickbait and not-clickbait with probability bars">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1726"/>
      <stop offset="1" stop-color="#0e0c14"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bgC)"/>

  <!-- headline card 1: clickbait -->
  <g transform="translate(56 58)">
    <rect width="380" height="94" rx="12" fill="#241d2f" stroke="#3b3049" stroke-width="1.5"/>
    <g fill="#6d5f83">
      <rect x="24" y="26" width="210" height="11" rx="5.5" fill="#c9b6e6"/>
      <rect x="244" y="26" width="60" height="11" rx="5.5" fill="#c9b6e6"/>
      <rect x="24" y="50" width="150" height="11" rx="5.5"/>
      <rect x="184" y="50" width="94" height="11" rx="5.5"/>
    </g>
    <text x="316" y="76" font-family="ui-monospace, monospace" font-size="13" fill="#f0913f">0.97</text>
  </g>
  <g transform="translate(456 76)">
    <rect width="128" height="34" rx="17" fill="#f0913f"/>
    <text x="64" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#1b1726">CLICKBAIT</text>
  </g>

  <!-- headline card 2: not clickbait -->
  <g transform="translate(56 186)">
    <rect width="380" height="94" rx="12" fill="#1e1b26" stroke="#302b3c" stroke-width="1.5"/>
    <g fill="#4f4a5e">
      <rect x="24" y="26" width="188" height="11" rx="5.5" fill="#8f8aa3"/>
      <rect x="222" y="26" width="92" height="11" rx="5.5" fill="#8f8aa3"/>
      <rect x="24" y="50" width="120" height="11" rx="5.5"/>
      <rect x="154" y="50" width="132" height="11" rx="5.5"/>
    </g>
    <text x="316" y="76" font-family="ui-monospace, monospace" font-size="13" fill="#8f8aa3">0.04</text>
  </g>
  <g transform="translate(456 204)">
    <rect width="128" height="34" rx="17" fill="none" stroke="#4a4459" stroke-width="1.5"/>
    <text x="64" y="23" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#8f8aa3">GENUINE</text>
  </g>

  <!-- connector -->
  <path d="M440 105h12" stroke="#f0913f" stroke-width="2" stroke-linecap="round"/>
  <path d="M440 233h12" stroke="#4a4459" stroke-width="2" stroke-linecap="round"/>

  <text x="56" y="322" font-family="ui-monospace, monospace" font-size="12" fill="#7a7290">DistilBERT &#183; 32k headlines &#183; locked test set</text>
</svg>
